# 카메라 없이 개발할 때 쓰는 설정. ffmpeg가 시각이 찍힌 H.264 테스트 영상을 만든다.
# 프로젝트 루트에서 실행해야 test-overlay.ffscript 경로가 맞는다.
api:
  listen: "127.0.0.1:1984"
webrtc:
  listen: ":8555"
streams:
  camera: exec:ffmpeg -hide_banner -loglevel error -re -f lavfi -i testsrc2=size=1280x720:rate=25 -/filter:v config/test-overlay.ffscript -c:v libx264 -preset ultrafast -tune zerolatency -g 25 -pix_fmt yuv420p -f rtsp {output}
